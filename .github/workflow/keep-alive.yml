name: Supabase keep-alive

on:
  schedule:
    # Every 2 days at 05:17 UTC. Off-the-hour on purpose:
    # top-of-hour cron slots are GitHub's busiest and most delayed.
    - cron: '17 5 */2 * *'
  workflow_dispatch:   # also lets you trigger it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep_alive table
        run: |
          http_code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "HTTP status: $http_code"
          echo "Response body: $(cat /tmp/resp.txt)"

          if [ "$http_code" -ne 200 ]; then
            echo "::error::Keep-alive ping failed with status $http_code"
            exit 1
          fi

          echo "Keep-alive ping succeeded."
